{% extends "app_akku/base.html" %}

{% block contenido %}
<div style="text-align: center; font-family: Arial, sans-serif; padding: 20px;">
    <h1 style="text-transform: uppercase; color: #1a2a40; border-left: 5px solid #D12B2E; display: inline-block; padding-left: 15px;">
        Buscador de Soluciones Akkü
    </h1>
    
    <form method="GET" style="margin: 30px 0;">
        <input type="text" name="nombre" value="{{ query }}" placeholder="Ej: Growth, Data..." 
               style="padding: 12px; width: 40%; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit" style="padding: 12px 25px; background-color: #D12B2E; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            BUSCAR
        </button>
    </form>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto;">
        {% for s in resultados %}
        <div style="border: 1px solid #eee; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white;">
            <h3 style="color: #1a2a40;">{{ s.nombre }}</h3>
            <p style="color: #666;">{{ s.desc }}</p>
            <p style="font-weight: bold; color: #D12B2E;">{{ s.precio }}</p>
            <button style="background: #D12B2E; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">VER DETALLES</button>
        </div>
        {% empty %}
        <p style="color: red; grid-column: 1/-1;">No se encontraron servicios para "{{ query }}".</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
